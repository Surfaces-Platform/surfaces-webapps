<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="surfaces-mark-small-reverse-title surfaces-mark-small-reverse-desc">
  <title id="surfaces-mark-small-reverse-title">Surfaces Platform small reverse mark</title>
  <desc id="surfaces-mark-small-reverse-desc">A simplified one-color Surfaces mark for small sizes on dark backgrounds.</desc>
  <defs>
    <mask id="surface-small-reverse-mask" maskUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="20" y="18" width="25" height="7" rx="0.5" fill="#000"/>
      <rect x="20" y="29" width="16" height="7" rx="0.5" fill="#000"/>
      <rect x="28" y="40" width="17" height="7" rx="0.5" fill="#000"/>
    </mask>
  </defs>
  <rect x="12" y="10" width="40" height="44" rx="3" fill="#F7F7F4" mask="url(#surface-small-reverse-mask)"/>
</svg>
