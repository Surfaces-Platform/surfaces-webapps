name: Interface Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-interface:
    name: Validate surfaces against contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.INTERFACECTL_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install interfacectl dependencies
        working-directory: tools/interfacectl
        run: pnpm install --frozen-lockfile

      - name: Build interfacectl
        working-directory: tools/interfacectl
        run: pnpm run build

      - name: Validate interface contract
        env:
          INTERFACECTL_BIN: ${{ github.workspace }}/tools/interfacectl/packages/interfacectl-cli/dist/index.js
        run: |
          node "$INTERFACECTL_BIN" validate \
            --root . \
            --contract contracts/surfaces.web.contract.json \
            --format json

