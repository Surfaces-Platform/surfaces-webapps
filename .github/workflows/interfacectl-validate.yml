name: Interface Contract

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-interface:
    name: Validate surfaces against contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout interfacectl tooling
        uses: actions/checkout@v4
        with:
          repository: mikeylong/interfacectl
          path: interfacectl-tooling

      - name: Install interfacectl dependencies
        working-directory: interfacectl-tooling
        run: pnpm install --frozen-lockfile --prod

      - name: Validate interface contract
        env:
          INTERFACECTL_BIN: ${{ github.workspace }}/interfacectl-tooling/packages/interfacectl-cli/dist/index.js
        run: |
          node "$INTERFACECTL_BIN" validate \
            --root . \
            --contract contracts/surfaces.web.contract.json \
            --format json


