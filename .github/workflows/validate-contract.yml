name: Validate Interface Contract

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 7 * * *"

jobs:
  validate:
    name: Validate Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: surfaces-webapps
    env:
      SURFACES_INTERFACECTL_ROOT: ${{ github.workspace }}/interfacectl
    
    steps:
      - name: Checkout surfaces-webapps
        uses: actions/checkout@v4
        with:
          path: surfaces-webapps
          token: ${{ secrets.INTERFACECTL_TOKEN || github.token }}

      - name: Checkout interfacectl
        uses: actions/checkout@v4
        with:
          repository: Surfaces-Platform/interfacectl
          path: interfacectl
          token: ${{ secrets.INTERFACECTL_TOKEN || github.token }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: surfaces-webapps/package.json
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: surfaces-webapps/pnpm-lock.yaml
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build interfacectl
        run: pnpm run interfacectl:build

      - name: Install interfacectl Playwright browser
        working-directory: interfacectl
        run: pnpm --filter @surfaces/interfacectl-cli exec playwright install chromium

      - name: Onboarding smoke test (headless)
        run: pnpm run test:onboarding:smoke:headless
      
      - name: Build edge manifest
        run: pnpm examples:build-manifest
      
      - name: Edge validator smoke test
        run: pnpm examples:test-edge
      
      - name: Platform behavior e2e smoke test
        run: pnpm test:platform-e2e
      
      - name: Show CLI provenance
        run: pnpm cli:where:ci

      - name: Print validation provenance
        run: node scripts/print-provenance.mjs --strict

      - name: Ensure artifacts directory
        run: mkdir -p artifacts
      
      - name: Validate interface contract
        run: pnpm run validate:contract:json

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: interfacectl-report
          path: surfaces-webapps/artifacts/interfacectl-report.json
      
      - name: Generate contract (surfaces-web)
        run: pnpm run generate:contract
      
      - name: Validate extracted (Phase 0.5)
        run: pnpm run validate:extracted

      - name: Validate run artifacts schema
        run: pnpm run validate:run-artifacts

      - name: Check promotion readiness
        run: |
          MODE="${PROMOTION_READINESS_MODE:-advisory}"
          node scripts/check-promotion-readiness.mjs \
            --mode "$MODE" \
            --output ./artifacts/promotion-readiness.json

      - name: Upload promotion readiness artifact
        uses: actions/upload-artifact@v4
        with:
          name: promotion-readiness
          path: surfaces-webapps/artifacts/promotion-readiness.json
      
      - name: Check generated contract drift
        run: |
          if ! git diff --exit-code contracts/generated/; then
            echo "::error::Generated contract artifacts are out of date. Run: pnpm run interfacectl:build && pnpm run generate:contract"
            exit 1
          fi

  onboarding-browser-smoke:
    name: Onboarding Browser Smoke
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    env:
      SURFACES_INTERFACECTL_ROOT: ${{ github.workspace }}/interfacectl
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.INTERFACECTL_TOKEN || github.token }}

      - name: Checkout interfacectl
        uses: actions/checkout@v4
        with:
          repository: Surfaces-Platform/interfacectl
          path: interfacectl
          token: ${{ secrets.INTERFACECTL_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build interfacectl
        run: pnpm run interfacectl:build

      - name: Build platform auth package
        run: pnpm --filter @surfaces/platform-auth build

      - name: Install interfacectl Playwright browser
        working-directory: interfacectl
        run: pnpm --filter @surfaces/interfacectl-cli exec playwright install chromium

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Onboarding smoke test (browser)
        run: pnpm run test:onboarding:smoke:browser

      - name: Upload browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: onboarding-browser-smoke-logs
          path: |
            apps/surfaceops-web/.next
            apps/surfaceops-web/test-results

  surfaceops-db-tests:
    name: SurfaceOps DB Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.INTERFACECTL_TOKEN || github.token }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run surfaceops-web tests with DB
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL not set; skipping DB-specific test execution."
            exit 0
          fi
          pnpm --filter surfaceops-web test
