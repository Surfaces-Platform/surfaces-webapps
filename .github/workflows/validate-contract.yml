name: Validate Interface Contract

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Contract
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.2
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Checkout interfacectl tooling
        uses: actions/checkout@v4
        with:
          repository: Surfaces-Platform/interfacectl
          path: interfacectl-tooling
          ref: feat/pageframe-color-policy
      
      - name: Install interfacectl dependencies
        working-directory: interfacectl-tooling
        run: pnpm install --frozen-lockfile
      
      - name: Build interfacectl
        working-directory: interfacectl-tooling
        run: pnpm run build
      
      - name: Show CLI provenance
        run: pnpm cli:where:ci
      
      - name: Validate interface contract
        run: pnpm validate:ci
