name: Validate Interface Contract

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Contract
    runs-on: ubuntu-latest
    env:
      INTERFACECTL_BIN: ${{ github.workspace }}/interfacectl-tooling/packages/interfacectl-cli/dist/index.js
    permissions:
      contents: read
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Checkout interfacectl tooling
        uses: actions/checkout@v4
        with:
          repository: Surfaces-Platform/interfacectl
          path: interfacectl-tooling
          ref: main
          token: ${{ secrets.INTERFACECTL_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Install interfacectl dependencies
        working-directory: interfacectl-tooling
        run: pnpm install --frozen-lockfile
      
      - name: Build interfacectl
        working-directory: interfacectl-tooling
        run: pnpm run build
      
      - name: Show CLI provenance
        run: pnpm cli:where:ci
      
      - name: Validate interface contract
        run: |
          node "$INTERFACECTL_BIN" validate \
            --workspace-root . \
            --contract ./contracts/surfaces.web.contract.json \
            --format json
      
      - name: Generate contract (surfaces-web)
        run: |
          node "$INTERFACECTL_BIN" generate-contract \
            --app-root apps/surfaces-web \
            --surface surfaces-web
      
      - name: Check generated contract drift
        run: |
          if ! git diff --exit-code contracts/generated/; then
            echo "::error::Generated contract artifacts are out of date. Run 'pnpm run generate:contract' locally and commit the updated contracts/generated/ files."
            exit 1
          fi
