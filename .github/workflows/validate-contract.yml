name: Validate Interface Contract

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Validate Contract
    runs-on: ubuntu-latest
    env:
      INTERFACECTL_BIN: ${{ github.workspace }}/tools/interfacectl/packages/interfacectl-cli/dist/index.js
    permissions:
      contents: read
      pull-requests: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          ssh-key: ${{ secrets.INTERFACECTL_SUBMODULE_SSH_KEY }}
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Build interfacectl
        run: pnpm run interfacectl:build
      
      - name: Show CLI provenance
        run: pnpm cli:where:ci
      
      - name: Validate interface contract
        run: |
          node "$INTERFACECTL_BIN" validate \
            --workspace-root . \
            --contract ./contracts/surfaces.web.contract.json \
            --format json
      
      - name: Generate contract (surfaces-web)
        run: pnpm run generate:contract
      
      - name: Validate extracted (Phase 0.5)
        run: |
          node "$INTERFACECTL_BIN" validate-extracted \
            --contract ./contracts/surfaces.web.contract.json \
            --extracted ./contracts/generated/surfaces-web.extraction.json \
            --surface surfaces-web \
            --exit-codes v2
      
      - name: Check generated contract drift
        run: |
          if ! git diff --exit-code contracts/generated/; then
            echo "::error::Generated contract artifacts are out of date. Run: pnpm run interfacectl:build && pnpm run generate:contract"
            exit 1
          fi
